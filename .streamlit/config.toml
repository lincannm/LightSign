[server]
# run.py 自动生成或更新这两个文件，然后启用 HTTPS
sslCertFile = "certs/cert.pem"
sslKeyFile = "certs/key.pem"

# 组织者入口端口；run.py 会另启 8504 端口的参与者入口
port = 8503
address = "127.0.0.1"

# 参与者服务的局域网监听地址由 run.py 单独配置
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
# 自动打开浏览器
gatherUsageStats = false
